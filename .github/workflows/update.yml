name: Update new songs & publish

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 6:00 AM India time
  workflow_dispatch:        # "Run workflow" button to update now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest releases
        run: node scripts/update.mjs
        continue-on-error: true
      - name: Save updated song list
        run: |
          git config user.name "dhun-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new.json data/channels.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Daily update: new releases" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
